{% extends "base.html" %}
{% block title %}Dự án{% endblock %}
{% block head %}
{{ super() }}
<style>.project { border-left: 4px solid #0d6efd; }</style>
{% endblock %}
{% block content %}
<h1 class="mb-3">Dự án</h1>
{% for p in projects %}
<div class="project ps-3 mb-3">
  <h2 class="h5">{{ p.ten }}</h2>
  <p class="mb-0">{{ p.mo_ta }}</p>
</div>
{% else %}
<p class="text-muted">Chưa có dự án.</p>
{% endfor %}
{% endblock %}
