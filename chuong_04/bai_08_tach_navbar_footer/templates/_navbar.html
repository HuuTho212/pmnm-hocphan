{% set menu = [("about", "Giới thiệu"), ("hoc_van", "Học vấn"), ("du_an", "Dự án"), ("lien_he", "Liên hệ")] %}
<nav class="navbar navbar-expand-md navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('about') }}">{{ owner.ho_ten }}</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
            aria-controls="menu" aria-expanded="false" aria-label="Mở menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        {% for endpoint, label in menu %}
        <li class="nav-item">
          <a class="nav-link {{ 'active' if request.endpoint == endpoint }}" href="{{ url_for(endpoint) }}">{{ label }}</a>
        </li>
        {% endfor %}
      </ul>
    </div>
  </div>
</nav>
