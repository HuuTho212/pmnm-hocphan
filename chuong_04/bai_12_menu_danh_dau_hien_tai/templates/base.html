<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} - {{ site_name }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-md navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('index') }}">{{ site_name }}</a>
      <ul class="navbar-nav ms-auto flex-row gap-3">
        {# menu sinh bằng vòng lặp; is_active đến từ context processor #}
        {% for endpoint, label in menu %}
        <li class="nav-item"><a class="nav-link {{ is_active(endpoint) }}" href="{{ url_for(endpoint) }}">{{ label }}</a></li>
        {% endfor %}
      </ul>
    </div>
  </nav>
  <main class="container py-4 flex-grow-1">{% block content %}{% endblock %}</main>
  <footer class="border-top py-3 text-center text-muted small">&copy; {{ current_year }} {{ site_name }}</footer>
</body>
</html>
