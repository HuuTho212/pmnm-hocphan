{% from "_macros.html" import pagination %}
<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
  <main class="container py-4">
    <h1 class="mb-3">{{ title }} <small class="text-muted fs-6">trang {{ page }}/{{ total_pages }}</small></h1>
    <ul class="list-group mb-3">
      {% for r in rows %}<li class="list-group-item">{{ r }}</li>{% endfor %}
    </ul>
    {{ pagination(page, total_pages, endpoint) }}
  </main>
</body>
</html>
