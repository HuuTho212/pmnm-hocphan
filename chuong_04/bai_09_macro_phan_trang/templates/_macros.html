{% macro pagination(page, total_pages, endpoint) -%}
<nav aria-label="Phân trang">
  <ul class="pagination justify-content-center">
    <li class="page-item {{ 'disabled' if page <= 1 }}">
      <a class="page-link" href="{{ url_for(endpoint, page=page - 1) if page > 1 else '#' }}">Trước</a>
    </li>
    {% for n in range(1, total_pages + 1) %}
    <li class="page-item {{ 'active' if n == page }}">
      <a class="page-link" href="{{ url_for(endpoint, page=n) }}">{{ n }}</a>
    </li>
    {% endfor %}
    <li class="page-item {{ 'disabled' if page >= total_pages }}">
      <a class="page-link" href="{{ url_for(endpoint, page=page + 1) if page < total_pages else '#' }}">Sau</a>
    </li>
  </ul>
</nav>
{%- endmacro %}
