<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sản phẩm</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
  <main class="container py-4">
    <h1 class="mb-4">Sản phẩm</h1>
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-3">
      {% for p in products %}
      <div class="col">
        <div class="card h-100 {{ 'opacity-75' if not p.con_hang }}">
          <div class="card-body">
            <h2 class="h5 card-title">{{ p.ten }}</h2>
            <p class="card-text fw-semibold">{{ p.gia|vnd }}</p>
            {% if p.con_hang %}
              <span class="badge text-bg-success">Còn hàng</span>
            {% else %}
              <span class="badge text-bg-secondary">Hết hàng</span>
            {% endif %}
          </div>
          <div class="card-footer bg-transparent">
            <button class="btn btn-primary btn-sm w-100" {{ 'disabled' if not p.con_hang }}>Thêm vào giỏ</button>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </main>
</body>
</html>
