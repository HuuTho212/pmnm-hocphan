<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Quản lý sinh viên{% endblock %}</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand">Quản lý sinh viên</span>
            <div class="navbar-nav">
                <a class="nav-link" href="{{ url_for('add_sample') }}">Thêm mẫu</a>
                <a class="nav-link" href="{{ url_for('try_queries') }}">Thử truy vấn</a>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
